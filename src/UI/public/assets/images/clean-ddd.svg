<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Clean DDD Architecture</title>
  <desc id="desc">A layered architecture diagram for a .NET reference project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102d42"/><stop offset="1" stop-color="#061018"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g fill="none" stroke="url(#ring)" stroke-width="3" opacity=".85">
    <rect x="170" y="112" width="940" height="496" rx="34"/>
    <rect x="260" y="182" width="760" height="356" rx="28"/>
    <rect x="370" y="252" width="540" height="216" rx="22"/>
  </g>
  <g fill="#dcecf6" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="640" y="77" font-size="34" font-weight="700">Clean DDD Architecture</text>
    <text x="640" y="145" font-size="21" opacity=".72">Infrastructure</text>
    <text x="640" y="218" font-size="21" opacity=".82">Application</text>
    <text x="640" y="322" font-size="25" font-weight="700">Domain</text>
    <text x="640" y="365" font-size="18" opacity=".7">Entities · Value Objects · Rules</text>
  </g>
  <g fill="#60a5fa" opacity=".65"><circle cx="213" cy="360" r="8"/><circle cx="1067" cy="360" r="8"/><circle cx="640" cy="207" r="7"/><circle cx="640" cy="514" r="7"/></g>
</svg>
